<!DOCTYPE html>
<html>
<head>
    <title>Cybersecurity Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #101820;
            color: #00ff88;
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: #1c2935;
            padding: 25px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: #00ff88;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        #result {
            margin-top: 20px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>CYBER DEMO</h1>
    <p>Permission-based security demonstration</p>

    <button onclick="getLocation()">Share My Location</button>
    <button onclick="getCamera()">Enable Camera Preview</button>
    <button onclick="getMicrophone()">Test Microphone</button>
    <button onclick="getDevice()">Show Device Information</button>

    <div id="result"></div>
    <video id="video" autoplay playsinline width="100%"></video>
</div>

<script>
function getLocation() {
    navigator.geolocation.getCurrentPosition(
        position => {
            document.getElementById("result").innerText =
            "Latitude: " + position.coords.latitude +
            "\nLongitude: " + position.coords.longitude;
        },
        error => alert("Location permission denied or unavailable.")
    );
}

async function getCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({video: true});
        document.getElementById("video").srcObject = stream;
    } catch (error) {
        alert("Camera permission denied or unavailable.");
    }
}

async function getMicrophone() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({audio: true});
        stream.getTracks().forEach(track => track.stop());
        alert("Microphone permission granted. No audio was recorded.");
    } catch (error) {
        alert("Microphone permission denied or unavailable.");
    }
}

function getDevice() {
    document.getElementById("result").innerText =
        "Browser: " + navigator.userAgent +
        "\nPlatform: " + navigator.platform;
}
</script>

</body>
</html>
